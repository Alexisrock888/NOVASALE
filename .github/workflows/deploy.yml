name: Deploy NovaSale to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages to deploy from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e '
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`
          const headers = {
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          }
          const current = await fetch(endpoint, { headers })
          const method = current.status === 404 ? "POST" : "PUT"
          const response = await fetch(endpoint, {
            method,
            headers,
            body: JSON.stringify({ build_type: "workflow" }),
          })
          if (!response.ok && response.status !== 204) {
            throw new Error(`GitHub Pages configuration failed (${response.status}): ${await response.text()}`)
          }
          console.log("GitHub Pages is configured to publish the compiled site from Actions.")
          '
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
